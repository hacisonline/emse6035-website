project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - "*.qmd"
    - "**/*.qmd"

website:
  title: "EMSE 6035 Project Tracker"
  description: "Team project tracker for EMSE 6035, Marketing Analytics for Design Decisions, GWU, Fall 2026"
  favicon: favicon.svg
  navbar:
    background: "#0f172a"
    foreground: "#e6e9ef"
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Project"
        href: context-bank/project.qmd
      - text: "Schedule"
        href: tracker/schedule.qmd
      - text: "Critical path"
        href: tracker/critical-path.qmd
      - text: "Tracker"
        menu:
          - text: "Activities"
            href: tracker/activities.qmd
          - text: "Requirements"
            href: tracker/coverage.qmd
          - text: "Risks"
            href: tracker/risks.qmd
          - text: "Week by week"
            href: tracker/progress.qmd
      - text: "Dev log"
        href: devlog/index.qmd
      - text: "Context bank"
        href: context-bank/index.qmd
  sidebar:
    - title: "Context bank"
      style: docked
      contents:
        - context-bank/index.qmd
        - context-bank/project.qmd
        - context-bank/course.qmd
        - context-bank/deadlines.qmd
        - context-bank/project-requirements.qmd
        - context-bank/team.qmd
        - context-bank/conventions.qmd
  page-footer:
    left: "EMSE 6035 team project tracker. Public site: no grades, no personal details, no credentials."
    right: "Built with Quarto and R; the schedule is computed from data/*.csv on every render."

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: false
    df-print: kable
    html-table-processing: none
    page-layout: full
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    include-after-body:
      - assets/tracker.html

execute:
  echo: false
  warning: false
  message: false
  freeze: false
